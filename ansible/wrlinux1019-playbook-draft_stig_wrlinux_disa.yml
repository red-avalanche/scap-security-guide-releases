###############################################################################
#
# Ansible Playbook for DRAFT DISA STIG for Wind River Linux
#
# Profile Description:
# This profile contains configuration checks that align to the
# DISA STIG for Wind River Linux.
# This profile is being developed under the DoD consensus model to
# become a STIG in coordination with DISA FSO.
# What is the status of the Wind River Linux STIG?
# The Wind River Linux STIG is in development under the DoD consensus model
# and Wind River has started the process to get approval from DISA. However, in
# the absence of an approved SRG or STIG, vendor recommendations may be used
# instead. The current contents constitute the vendor recommendations at the
# time of the product release containing these contents.
# Note that changes are expected before approval is granted, and those changes
# will be made available in future Wind River Linux Security Profile 1019 RCPL releases.
# More information, including the following, is available from the DISA FAQs
# at https://public.cyber.mil/stigs/faqs/
#
# Profile ID:  draft_stig_wrlinux_disa
# Benchmark ID:  WRLINUX
# Benchmark Version:  0.1.46
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.3.1 using:
# $ oscap xccdf generate fix --profile draft_stig_wrlinux_disa --fix-type ansible xccdf-file.xml
#
# This Ansible Playbook is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this Ansible Playbook:
# $ ansible-playbook -i "localhost," -c local playbook.yml
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################

- hosts: all
  vars:
    var_removable_partition: !!str /dev/cdrom
  tasks:
    - name: Get nfs and nfs4 mount points, that don't have Kerberos security option
      shell: |
        set -o pipefail
        grep -E "[[:space:]]nfs[4]?[[:space:]]" /etc/fstab | grep -v "sec=krb5:krb5i:krb5p" | awk '{print $2}'
      args:
        warn: false
        executable: /bin/bash
      register: points_register
      check_mode: false
      changed_when: false
      tags:
        - mount_option_krb_sec_remote_filesystems
        - medium_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - no_reboot_needed
        - NIST-800-53-AC-14(1)
    - name: Add Kerberos security to mount points
      shell: awk '$2=="{{ item }}"{$4=$4",sec=krb5:krb5i:krb5p"}1' /etc/fstab > fstab.tmp
        && mv fstab.tmp /etc/fstab
      args:
        warn: false
      with_items:
        - '{{ points_register.stdout_lines }}'
      when: (points_register.stdout | length > 0)
      tags:
        - mount_option_krb_sec_remote_filesystems
        - medium_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - no_reboot_needed
        - NIST-800-53-AC-14(1)

    - name: Get nfs and nfs4 mount points, that don't have noexec
      shell: |
        set -o pipefail
        grep -E "[[:space:]]nfs[4]?[[:space:]]" /etc/fstab | grep -v "noexec" | awk '{print $2}'
      args:
        executable: /bin/bash
      register: points_register
      check_mode: false
      changed_when: false
      tags:
        - mount_option_noexec_remote_filesystems
        - medium_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - no_reboot_needed
        - NIST-800-53-AC-6
    - name: Add noexec to mount points
      shell: awk '$2=="{{ item }}"{$4=$4",noexec"}1' /etc/fstab > fstab.tmp && mv fstab.tmp
        /etc/fstab
      args:
        executable: /bin/bash
      with_items:
        - '{{ points_register.stdout_lines }}'
      when: (points_register.stdout | length > 0)
      tags:
        - mount_option_noexec_remote_filesystems
        - medium_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - no_reboot_needed
        - NIST-800-53-AC-6

    - name: Get nfs and nfs4 mount points, that don't have nosuid
      shell: |
        set -o pipefail
        grep -E "[[:space:]]nfs[4]?[[:space:]]" /etc/fstab | grep -v "nosuid" | awk '{print $2}'
      args:
        executable: /bin/bash
      register: points_register
      check_mode: false
      changed_when: false
      tags:
        - mount_option_nosuid_remote_filesystems
        - medium_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - no_reboot_needed
        - NIST-800-53-AC-6
    - name: Add nosuid to mount points
      shell: awk '$2=="{{ item }}"{$4=$4",nosuid"}1' /etc/fstab > fstab.tmp && mv fstab.tmp
        /etc/fstab
      args:
        executable: /bin/bash
      with_items:
        - '{{ points_register.stdout_lines }}'
      when: (points_register.stdout | length > 0)
      tags:
        - mount_option_nosuid_remote_filesystems
        - medium_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - no_reboot_needed
        - NIST-800-53-AC-6

    - name: Rule title of disable_host_auth
      block:
        - name: Deduplicate values from /etc/ssh/sshd_config
          lineinfile:
            path: /etc/ssh/sshd_config
            create: false
            regexp: (?i)^\s*HostbasedAuthentication\s+
            state: absent
        - name: Insert correct line to /etc/ssh/sshd_config
          lineinfile:
            path: /etc/ssh/sshd_config
            create: true
            line: HostbasedAuthentication no
            state: present
            insertbefore: ^Match
            validate: /usr/sbin/sshd -t -f %s
      when: ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker"
      tags:
        - disable_host_auth
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed
