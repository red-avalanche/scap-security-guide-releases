###############################################################################
#
# Ansible Playbook for Open Computing Information Security Profile for OpenShift Master Node
#
# Profile Description:
# This baseline was inspired by the Center for Internet Security
# (CIS) Kubernetes Benchmark, v1.5.0 - 10-14-2019.
# For the ComplianceAsCode project to remain in compliance with
# CIS' terms and conditions, specifically Restrictions(8), note
# there is no representation or claim that the OpenCIS profile will
# ensure a system is in compliance or consistency with the CIS
# baseline.
#
# Profile ID:  opencis-master
# Benchmark ID:  OCP-4
# Benchmark Version:  0.1.49
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.3.2 using:
# $ oscap xccdf generate fix --profile opencis-master --fix-type ansible xccdf-file.xml
#
# This Ansible Playbook is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this Ansible Playbook:
# $ ansible-playbook -i "localhost," -c local playbook.yml
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################

- hosts: all
  vars:
  tasks:
    - name: '@RULE_TITLE@'
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: ^ETCD_WAL_DIR=
        line: ETCD_WAL_DIR=/var/lib/etcd/member/wal
        create: true
      tags:
        - etcd_wal_dir
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed

    - name: '@RULE_TITLE@'
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: ^ETCD_CLIENT_CERT_AUTH=
        line: ETCD_CLIENT_CERT_AUTH=true
        create: true
      tags:
        - etcd_client_cert_auth
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed

    - name: '@RULE_TITLE@'
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: ^ETCD_PEER_KEY_FILE
        line: ETCD_PEER_KEY_FILE=/etc/etcd/peer.key
        create: true
      tags:
        - etcd_peer_key_file
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed

    - name: '@RULE_TITLE@'
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: ^ETCD_PEER_CERT_FILE
        line: ETCD_PEER_CERT_FILE=/etc/etcd/peer.crt
        create: true
      tags:
        - etcd_peer_cert_file
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed

    - name: '@RULE_TITLE@'
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: ^ETCD_CERT_FILE
        line: ETCD_CERT_FILE=/etc/etcd/server.crt
        create: true
      tags:
        - etcd_cert_file
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed

    - name: '@RULE_TITLE@'
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: ^ETCD_AUTO_TLS=
        line: ETCD_AUTO_TLS=false
        create: true
      tags:
        - etcd_auto_tls
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed

    - name: '@RULE_TITLE@'
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: ^ETCD_KEY_FILE=
        line: ETCD_KEY_FILE=/etc/etcd/server.key
        create: true
      tags:
        - etcd_key_file
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed

    - name: '@RULE_TITLE@'
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: ^ETCD_PEER_AUTO_TLS=
        line: ETCD_PEER_AUTO_TLS=false
        create: true
      tags:
        - etcd_peer_auto_tls
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed

    - name: '@RULE_TITLE@'
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: ^ETCD_TRUSTED_CA_FILE=
        line: ETCD_TRUSTED_CA_FILE=/etc/etcd/ca.crt
        create: true
      tags:
        - etcd_unique_ca
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed

    - name: '@RULE_TITLE@'
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: ^ETCD_PEER_CLIENT_CERT_AUTH=
        line: ETCD_PEER_CLIENT_CERT_AUTH=true
        create: true
      tags:
        - etcd_peer_client_cert_auth
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - no_reboot_needed

