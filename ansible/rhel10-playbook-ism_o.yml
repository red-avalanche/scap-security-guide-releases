      - NIST-800-53-CM-6(b)
      - NIST-800-53-CM-7(a)
      - NIST-800-53-CM-7(b)
      - configure_strategy
      - firewalld_sshd_port_enabled
      - low_complexity
      - low_disruption
      - medium_severity
      - no_reboot_needed

