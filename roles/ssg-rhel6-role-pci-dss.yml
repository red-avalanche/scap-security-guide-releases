        - NIST-800-53-SC-28
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000018
    
    - name: "Ensure AIDE is installed"
      package:
        name="{{item}}"
        state=present
      with_items:
        - aide
      tags:
        - aide_periodic_cron_checking
        - medium_severity
        - restrict_strategy
        - low_complexity
