        - NIST-800-53-CM-6(d)
        - NIST-800-53-SC-28
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5  
    
    - name: disable prelinking
      lineinfile:
        path: /etc/sysconfig/prelink
        regexp: '^PRELINKING='
        line: 'PRELINKING=no'
      when: prelink_exists.stat.exists == True
      tags:
        - disable_prelink
        - low_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27221-1
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SC-28
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
    
    - name: Ensure aide is installed
