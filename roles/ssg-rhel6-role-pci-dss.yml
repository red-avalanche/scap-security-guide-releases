###############################################################################
#
# Ansible remediation role for profile pci-dss
# Profile Title:  PCI-DSS v3 Control Baseline for Red Hat Enterprise Linux 6
# Profile Description:
# This is a *draft* profile for PCI-DSS v3.
#
# Benchmark ID:  RHEL-6
# Benchmark Version:  0.1.38
#
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.2.16 using:
# 	$ oscap xccdf generate fix --profile pci-dss --template urn:xccdf:fix:script:ansible sds.xml 
#
# This script is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this remediation role:
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################


 - hosts: all
   pre_tasks:
     - name: Verify Ansible meets SCAP-Security-Guide version requirements.
       assert:
         that: "ansible_version.full | version_compare('2.3', '>=')"
         msg: >
           "You must update Ansible to at least version 2.3 to use this role."
          
   vars:
      var_accounts_maximum_age_login_defs: 90
      var_account_disable_post_pw_expiration: 90
      var_password_pam_minlen: 7
      var_accounts_passwords_pam_faillock_deny: 6
      var_accounts_passwords_pam_faillock_unlock_time: 1800
      var_accounts_passwords_pam_faillock_fail_interval: 900
      var_password_pam_unix_remember: 4
      var_auditd_max_log_file: 6
      var_auditd_max_log_file_action: rotate
      var_auditd_space_left_action: email
      var_auditd_admin_space_left_action: single
      var_auditd_action_mail_acct: root
      sshd_idle_timeout_value: 900
   tasks:
    - name: "Read permission of GPG key directory"
      stat:
        path: /etc/pki/rpm-gpg/
      register: gpg_key_directory_permission
      check_mode: no
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    # It should fail if it doesn't find any fingerprints in file - maybe file was not parsed well.
    
    - name: Read signatures in GPG key
      shell: gpg --with-fingerprint '/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release' | grep 'Key fingerprint =' | tr -s ' ' | sed 's;.*= ;;g'
      changed_when: False
      register: gpg_fingerprints
      check_mode: no
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    - name: Set Fact - Valid fingerprints
      set_fact:
         gpg_valid_fingerprints: ("567E 347A D004 4ADE 55BA 8A5F 199E 2F91 FD43 1D51" "43A6 E49C 4A38 F4BE 9ABF 2A53 4568 9C88 2FA6 58E0")
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    - name: Import RedHat GPG key
      rpm_key:
        state: present
        key: /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
      when:
        (gpg_key_directory_permission.stat.mode <= '0755')
        and (( gpg_fingerprints.stdout_lines | difference(gpg_valid_fingerprints)) | length == 0)
        and (gpg_fingerprints.stdout_lines | length > 0)
        and (ansible_distribution == "RedHat")
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    - name: Check existence of yum on Fedora
      stat:
        path: /etc/yum.conf
      register: yum_config_file
      check_mode: no
      when: ansible_distribution == "Fedora"
    
    # Old versions of Fedora use yum
    
    - name: Ensure GPG check is globally activated (yum)
      ini_file:
        dest: "{{item}}"
        section: main
        option: gpgcheck
        value: 1
        create: False
      with_items: "/etc/yum.conf"
      when: ansible_distribution == "RedHat" or ansible_distribution == "CentOS" or yum_config_file.stat.exists
      tags:
        - ensure_gpgcheck_globally_activated
        - medium_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - CCE-26709-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000013
    
    - name: Ensure GPG check is globally activated (dnf)
      ini_file:
        dest: "{{item}}"
        section: main
        option: gpgcheck
        value: 1
        create: False
      with_items: "/etc/dnf/dnf.conf"
      when: ansible_distribution == "Fedora"
      tags:
        - ensure_gpgcheck_globally_activated
        - medium_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - CCE-26709-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000013
    
    
    #
    - name: Find All Yum Repositories
      find:
        paths: "/etc/yum.repos.d/"
        patterns: "*.repo"
      register: yum_find
    
    - name: Ensure gpgcheck Enabled For All Yum Package Repositories
      with_items: "{{ yum_find.files }}"
      lineinfile:
        create: yes
        dest: "{{ item.path }}"
        regexp: '^gpgcheck'
        line: 'gpgcheck=1'
      tags:
        - ensure_gpgcheck_never_disabled
        - low_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - CCE-26647-8
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000015
    
    - name: "Security patches are up to date"
      package:
        name: "*"
        state: "latest"
      tags:
        - security_patches_up_to_date
        - medium_severity
        - patch_strategy
        - low_complexity
        - high_disruption
        - CCE-27635-2
        - NIST-800-53-SI-2
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000011
    
    
    - name: Does prelink file exist
      stat:
        path=/etc/sysconfig/prelink
      register: prelink_exists
      tags:
        - disable_prelink
        - low_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
