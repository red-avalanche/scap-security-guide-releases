    #
    - name: Find All yum Repositories
      find:
        paths: "/etc/yum.repos.d/"
        patterns: "*.repo"
        contains: ^\[.+]$
      register: yum_find

    - name: Ensure gpgcheck Enabled For All yum Package Repositories
      with_items: "{{ yum_find.files }}"
      lineinfile:
        create: yes
        dest: "{{ item.path }}"
        regexp: '^gpgcheck'
        line: 'gpgcheck=1'
      tags:
        - ensure_gpgcheck_never_disabled
        - high_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - CCE-80792-5
        - NIST-800-53-CM-5(3)
