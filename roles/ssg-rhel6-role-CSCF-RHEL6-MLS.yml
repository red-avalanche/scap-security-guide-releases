      tags:
        - file_ownership_binary_dirs
        - medium_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-27623-8
        - NIST-800-53-AC-6
        - DISA-STIG-RHEL-06-000048
    
