###############################################################################
#
# Ansible remediation role for profile C2S
# Profile Title:  C2S for Red Hat Enterprise Linux 6
# Profile Description:
# This profile demonstrates compliance against the 
# U.S. Government Commercial Cloud Services (C2S) baseline.
# 
# This baseline was inspired by the Center for Internet Security
# (CIS) Red Hat Enterprise Linux 6 Benchmark, v1.2.0 - 06-25-2013.
# For the SCAP Security Guide project to remain in compliance with
# CIS' terms and conditions, specifically Restrictions(8), note 
# there is no representation or claim that the C2S profile will
# ensure a system is in compliance or consistency with the CIS
# baseline.
#
# Benchmark ID:  RHEL-6
# Benchmark Version:  0.1.41
#
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.2.17 using:
# 	$ oscap xccdf generate fix --profile C2S --template urn:xccdf:fix:script:ansible xccdf-file.xml 
#
# This script is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this remediation role:
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################


 - hosts: all
   pre_tasks:
     - name: Verify Ansible meets SCAP-Security-Guide version requirements.
       assert:
         that: "ansible_version.full is version_compare('2.3', '>=')"
         msg: >
           "You must update Ansible to at least version 2.3 to use this role."
          
   vars:
   tasks:
    - name: Disable service avahi-daemon
      service:
        name: avahi-daemon
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_avahi-daemon_disabled
        - unknown_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000246
    
    - name: Disable service rhnsd
      service:
        name: rhnsd
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_rhnsd_disabled
        - unknown_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000009
    
    - name: Disable service atd
      service:
        name: atd
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_atd_disabled
        - unknown_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000262
    
    - name: Enable service crond
      service:
        name: crond
        enabled: "yes"
        state: "started"
      tags:
        - service_crond_enabled
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000224
    
    - name: Ensure dhcp is removed
      package:
        name: dhcp
        state: absent
      tags:
        - package_dhcp_removed
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-CM-7
    
    - name: Ensure bind is removed
