    - name: Disable service cups
      service:
        name: cups
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_cups_disabled
        - unknown_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-CM-7
    
    - name: Ensure squid is removed
      package:
        name: squid
        state: absent
      tags:
