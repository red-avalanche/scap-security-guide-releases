    - name: Enable service ntpd
      service:
        name: ntpd
        enabled: "yes"
        state: "started"
      tags:
        - service_ntpd_enabled
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AU-8(1)
        - PCI-DSS-Req-10.4
        - DISA-STIG-RHEL-06-000247
    
    - name: Ensure xinetd is removed
      package:
        name: xinetd
        state: absent
      tags:
        - package_xinetd_removed
        - unknown_severity
        - disable_strategy
        - low_complexity
        - low_disruption
