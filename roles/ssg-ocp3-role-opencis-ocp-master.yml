###############################################################################
#
# Ansible remediation role for profile opencis-ocp-master
# Profile Title:  Open Computing Information Security Profile for OpenShift Master Node
# Profile Description:
# This baseline was inspired by the Center for Internet Security
# (CIS) Kubernetes Benchmark, v1.2.0 - 01-31-2017.
# 
# For the ComplianceAsCode project to remain in compliance with
# CIS' terms and conditions, specifically Restrictions(8), note
# there is no representation or claim that the OpenCIS profile will
# ensure a system is in compliance or consistency with the CIS
# baseline.
#
# Benchmark ID:  OCP-3
# Benchmark Version:  0.1.42
#
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.3.0 using:
# 	$ oscap xccdf generate fix --profile opencis-ocp-master --template urn:xccdf:fix:script:ansible xccdf-file.xml 
#
# This script is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this remediation role:
# $ ansible-playbook -i "localhost," -c local playbook.yml
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################


 - hosts: all
   pre_tasks:
     - name: Verify Ansible meets SCAP-Security-Guide version requirements.
       assert:
         that: "ansible_version.full is version_compare('2.3', '>=')"
         msg: >
           "You must update Ansible to at least version 2.3 to use this role."
          
   vars:
   tasks:
    - name: "Disable etcd Self-Signed Certificates"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_AUTO_TLS='
        line: "ETCD_AUTO_TLS=false"
        create: yes
      tags:
        - etcd_auto_tls
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    
    - name: "Ensure That The etcd Client Certificate Is Correctly Set"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_CERT_FILE'
        line: "ETCD_CERT_FILE /etc/etcd/server.crt"
        create: yes
      tags:
        - etcd_cert_file
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    - name: "Enable The Client Certificate Authentication"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_CLIENT_CERT_AUTH='
        line: "ETCD_CLIENT_CERT_AUTH=true"
        create: yes
      tags:
        - etcd_client_cert_auth
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    
    - name: "Ensure That The etcd Key File Is Correctly Set"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_KEY_FILE='
        line: "ETCD_KEY_FILE /etc/etcd/server.key"
        create: yes
      tags:
        - etcd_key_file
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    - name: "Disable etcd Auto Log Rotation"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_MAX_WALS='
        line: "ETCD_MAX_WALS=0"
        create: yes
      tags:
        - etcd_max_wals
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    - name: "Disable etcd Peer Self-Signed Certificates"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_PEER_AUTO_TLS='
        line: "ETCD_PEER_AUTO_TLS=false"
        create: yes
      tags:
        - etcd_peer_auto_tls
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    
    - name: "Ensure That The etcd Peer Client Certificate Is Correctly Set"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_PEER_CERT_FILE'
        line: "ETCD_PEER_CERT_FILE /etc/etcd/peer.crt"
        create: yes
      tags:
        - etcd_peer_cert_file
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    - name: "Enable The Peer Client Certificate Authentication"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_PEER_CLIENT_CERT_AUTH='
        line: "ETCD_PEER_CLIENT_CERT_AUTH=true"
        create: yes
      tags:
        - etcd_peer_client_cert_auth
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    
    - name: "Ensure That The etcd Peer Key File Is Correctly Set"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_PEER_KEY_FILE'
        line: "ETCD_PEER_KEY_FILE /etc/etcd/peer.key"
        create: yes
      tags:
        - etcd_peer_key_file
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    - name: "Configure A Unique CA Certificate for etcd"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_TRUSTED_CA_FILE='
        line: "ETCD_TRUSTED_CA_FILE=/etc/etcd/ca.crt"
        create: yes
      tags:
        - etcd_unique_ca
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    - name: "Configure etcd Log Storage"
      lineinfile:
        path: /etc/etcd/etcd.conf
        regexp: '^ETCD_WAL_DIR='
        line: "ETCD_WAL_DIR=/var/lib/etcd/member/wal"
        create: yes
      tags:
        - etcd_wal_dir
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
      
    
    - name: Test for existence /etc/origin
