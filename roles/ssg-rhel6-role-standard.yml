---
###############################################################################
#
# Ansible remediation role for profile standard
# Profile Title:  Standard System Security Profile
# Profile Description:
# This profile contains rules to ensure standard security 
# baseline of Red Hat Enterprise Linux 6 system. Regardless of your system's
# workload all of these checks should pass.
#
# Benchmark ID:  RHEL-6
# Benchmark Version:  0.1.37
#
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.2.16 using:
# 	$ oscap xccdf generate fix --profile standard --template urn:xccdf:fix:script:ansible sds.xml 
#
# This script is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this remediation role:
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################


 - hosts: all
   vars:
   tasks:
    - name: "Read permission of GPG key directory"
      stat:
        path: /etc/pki/rpm-gpg/
      register: gpg_key_directory_permission
      check_mode: no
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    # It should fail if it doesn't find any fingerprints in file - maybe file was not parsed well.
    
    - name: Read signatures in GPG key
      shell: gpg --with-fingerprint '/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release' | grep 'Key fingerprint =' | tr -s ' ' | sed 's;.*= ;;g'
      changed_when: False
      register: gpg_fingerprints
      check_mode: no
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    - name: Set Fact - Valid fingerprints
      set_fact:
         gpg_valid_fingerprints: ("567E 347A D004 4ADE 55BA 8A5F 199E 2F91 FD43 1D51" "43A6 E49C 4A38 F4BE 9ABF 2A53 4568 9C88 2FA6 58E0")
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    - name: Import RedHat GPG key
      rpm_key:
        state: present
        key: /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
      when:
        (gpg_key_directory_permission.stat.mode <= '0755')
        and (( gpg_fingerprints.stdout_lines | difference(gpg_valid_fingerprints)) | length == 0)
        and (gpg_fingerprints.stdout_lines | length > 0)
        and (ansible_distribution == "RedHat")
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    - name: Check existence of yum on Fedora
      stat:
        path: /etc/yum.conf
      register: yum_config_file
      check_mode: no
      when: ansible_distribution == "Fedora"
    
    # Old versions of Fedora use yum
    
    - name: Ensure GPG check is globally activated (yum)
      ini_file:
        dest: "{{item}}"
        section: main
        option: gpgcheck
        value: 1
        create: False
      with_items: "/etc/yum.conf"
      when: ansible_distribution == "RedHat" or ansible_distribution == "CentOS" or yum_config_file.stat.exists
      tags:
        - ensure_gpgcheck_globally_activated
        - medium_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - CCE-26709-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000013
    
    - name: Ensure GPG check is globally activated (dnf)
      ini_file:
        dest: "{{item}}"
        section: main
        option: gpgcheck
        value: 1
        create: False
      with_items: "/etc/dnf/dnf.conf"
      when: ansible_distribution == "Fedora"
      tags:
        - ensure_gpgcheck_globally_activated
        - medium_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - CCE-26709-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000013
    
    
    - name: "Read list of files with incorrect permissions"
      shell: "rpm -Va | grep '^.M' | cut -d ' ' -f5- | sed -r 's;^.*\\s+(.+);\\1;g'"
      register: files_with_incorrect_permissions
      failed_when: False
      changed_when: False
      check_mode: no
      tags:
        - rpm_verify_permissions
        - low_severity
        - restrict_strategy
        - high_complexity
        - medium_disruption
        - CCE-26731-0
        - NIST-800-53-AC-6
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000518
    
    - name: "Correct file permissions with RPM"
      shell: "rpm --setperms $(rpm -qf '{{item}}')"
      with_items: "{{ files_with_incorrect_permissions.stdout_lines }}"
      when: files_with_incorrect_permissions.stdout_lines | length > 0
      tags:
        - rpm_verify_permissions
        - low_severity
        - restrict_strategy
        - high_complexity
        - medium_disruption
        - CCE-26731-0
        - NIST-800-53-AC-6
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000518
    
    
    - name: "Set fact: Package manager reinstall command (dnf)"
      set_fact:
        package_manager_reinstall_cmd: dnf reinstall -y
      when: ansible_distribution == "Fedora"
      tags:
        - rpm_verify_hashes
        - low_severity
        - unknown_strategy
        - high_complexity
        - medium_disruption
        - CCE-27223-7
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000519
    
    - name: "Set fact: Package manager reinstall command (yum)"
      set_fact:
        package_manager_reinstall_cmd: yum reinstall -y
      when: ansible_distribution == "RedHat"
      tags:
        - rpm_verify_hashes
        - low_severity
        - unknown_strategy
        - high_complexity
        - medium_disruption
        - CCE-27223-7
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000519
    
    - name: "Read files with incorrect hash"
      shell: "rpm -Va | grep -E '^..5.* /(bin|sbin|lib|lib64|usr)/' | sed -r 's;^.*\\s+(.+);\\1;g'"
      register: files_with_incorrect_hash
      changed_when: False
      when: package_manager_reinstall_cmd is defined
      check_mode: no
      tags:
        - rpm_verify_hashes
        - low_severity
        - unknown_strategy
        - high_complexity
        - medium_disruption
        - CCE-27223-7
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000519
    
    - name: "Reinstall packages of files with incorrect hash"
      shell: "{{package_manager_reinstall_cmd}} $(rpm -qf '{{item}}')"
      with_items: "{{ files_with_incorrect_hash.stdout_lines }}"
      when: package_manager_reinstall_cmd is defined and (files_with_incorrect_hash.stdout_lines | length > 0)
      tags:
        - rpm_verify_hashes
        - low_severity
        - unknown_strategy
        - high_complexity
        - medium_disruption
        - CCE-27223-7
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000519
    
    
    - name: "Prevent Log In to Accounts With Empty Password - system-auth"
      replace:
        dest: /etc/pam.d/system-auth
        follow: yes
        regexp: 'nullok'
      tags:
        - no_empty_passwords
        - high_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - CCE-27038-9
        - NIST-800-53-IA-5(b)
        - NIST-800-53-IA-5(c)
        - NIST-800-53-IA-5(1)(a)
        - PCI-DSS-Req-8.2.3
        - DISA-STIG-RHEL-06-000030
    
    - name: "Prevent Log In to Accounts With Empty Password - password-auth"
      replace:
        dest: /etc/pam.d/password-auth
        follow: yes
        regexp: 'nullok'
      tags:
        - no_empty_passwords
        - high_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - CCE-27038-9
        - NIST-800-53-IA-5(b)
        - NIST-800-53-IA-5(c)
        - NIST-800-53-IA-5(1)(a)
        - PCI-DSS-Req-8.2.3
        - DISA-STIG-RHEL-06-000030
    
    
    - name: "Fail if user is not root"
      fail:
        msg: 'Root account required to read root $PATH'
      when: ansible_user != "root"
      tags:
        - accounts_root_path_dirs_no_write
        - low_severity
        - restrict_strategy
        - low_complexity
        - medium_disruption
        - CCE-26768-2
        - NIST-800-53-CM-6(b)
    
    - name: "Get root paths which are not symbolic links"
      shell: 'tr ":" "\n" <<< "$PATH" | xargs -I% find % -maxdepth 0 -type d'
      changed_when: False
      failed_when: False
      register: root_paths
      when: ansible_user == "root"
      check_mode: no
      tags:
        - accounts_root_path_dirs_no_write
        - low_severity
        - restrict_strategy
        - low_complexity
        - medium_disruption
        - CCE-26768-2
        - NIST-800-53-CM-6(b)
    
    - name: "Disable writability to root directories"
      file:
        path: "{{item}}"
        mode: "g-w,o-w"
      with_items: "{{ root_paths.stdout_lines }}"
      when: root_paths.stdout_lines is defined
      tags:
        - accounts_root_path_dirs_no_write
        - low_severity
        - restrict_strategy
        - low_complexity
        - medium_disruption
        - CCE-26768-2
        - NIST-800-53-CM-6(b)
    
    
