      with_items:
        - "{{ files_found.files }}"
      tags:
        - file_groupowner_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    
    
    - name: Find /etc/passwd file(s)
      find:
        paths: "{{ '/etc/passwd' | dirname }}"
        patterns: "{{ '/etc/passwd' | basename }}"
      register: files_found
      tags:
        - file_permissions_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    - name: Set permissions
