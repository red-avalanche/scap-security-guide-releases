---
###############################################################################
#
# Ansible remediation role for profile server
# Profile Title:  Server Baseline
# Profile Description:
# This profile is for Red Hat Enterprise Linux 6 acting as a server.
#
# Benchmark ID:  RHEL-6
# Benchmark Version:  0.1.43
#
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.3.0 using:
# 	$ oscap xccdf generate fix --profile server --template urn:xccdf:fix:script:ansible xccdf-file.xml
#
# This script is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this remediation role:
# $ ansible-playbook -i "localhost," -c local playbook.yml
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################

 - hosts: all
   pre_tasks:
     - name: Verify Ansible meets SCAP-Security-Guide version requirements.
       assert:
         that: "ansible_version.full is version_compare('2.5', '>=')"
         msg: >
           "You must update Ansible to at least version 2.5 to use this role."

   vars:
      sshd_idle_timeout_value: !!str 300
      var_sshd_set_keepalive: !!str 0
      var_password_pam_unix_remember: !!str 5
      var_accounts_passwords_pam_faillock_deny: !!str 3
      var_accounts_maximum_age_login_defs: !!str 90
      var_accounts_minimum_age_login_defs: !!str 7
      var_accounts_password_minlen_login_defs: !!str 15
      var_accounts_password_warn_age_login_defs: !!str 7
      var_accounts_tmout: !!str 600
      var_auditd_admin_space_left_action: !!str single
      var_auditd_max_log_file: !!str 6
      var_auditd_max_log_file_action: !!str rotate
      var_auditd_num_logs: !!str 5
      rsyslog_remote_loghost_address: !!str logcollector
      sysctl_net_ipv6_conf_default_accept_redirects_value: !!str 0
      sysctl_net_ipv4_conf_all_accept_redirects_value: !!str 0
      sysctl_net_ipv4_conf_all_accept_source_route_value: !!str 0
      sysctl_net_ipv4_conf_all_log_martians_value: !!str 1
      sysctl_net_ipv4_conf_all_rp_filter_value: !!str 1
      sysctl_net_ipv4_conf_all_secure_redirects_value: !!str 0
      sysctl_net_ipv4_conf_default_accept_redirects_value: !!str 0
      sysctl_net_ipv4_conf_default_accept_source_route_value: !!str 0
      sysctl_net_ipv4_conf_default_rp_filter_value: !!str 1
      sysctl_net_ipv4_conf_default_secure_redirects_value: !!str 0
      sysctl_net_ipv4_icmp_echo_ignore_broadcasts_value: !!str 1
      sysctl_net_ipv4_icmp_ignore_bogus_error_responses_value: !!str 1
      sysctl_net_ipv4_tcp_syncookies_value: !!str 1
      var_removable_partition: !!str /dev/cdrom
      var_selinux_policy_name: !!str targeted
      var_selinux_state: !!str enforcing
   tasks:
    - name: Disable service avahi-daemon
      service:
        name: avahi-daemon
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_avahi-daemon_disabled
        - unknown_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27087-6
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000246

    - name: Disable service abrtd
      service:
        name: abrtd
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_abrtd_disabled
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27247-6
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000261

    - name: Disable service ntpdate
      service:
        name: ntpdate
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_ntpdate_disabled
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27256-7
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000265

    - name: Disable service oddjobd
      service:
        name: oddjobd
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_oddjobd_disabled
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27257-5
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000266

    - name: Disable service qpidd
      service:
        name: qpidd
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_qpidd_disabled
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-26928-2
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000267

    - name: Disable service rdisc
      service:
        name: rdisc
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_rdisc_disabled
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27261-7
        - NIST-800-53-AC-17(8)
        - NIST-800-53-AC-4
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000268

    - name: Disable service rhnsd
      service:
        name: rhnsd
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_rhnsd_disabled
        - unknown_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-26846-6
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000009

    - name: Disable service atd
      service:
        name: atd
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_atd_disabled
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27249-2
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000262
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: Enable service crond
      service:
        name: crond
        enabled: "yes"
        state: "started"
      tags:
        - service_crond_enabled
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-27070-2
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000224
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: Ensure openldap-servers is removed
      package:
        name: openldap-servers
        state: absent
      tags:
        - package_openldap-servers_removed
        - unknown_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-26858-1
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000256

    - name: "Get nfs and nfs4 mount points, that don't have nodev"
      shell: grep -E "[[:space:]]nfs[4]?[[:space:]]" /etc/fstab | grep -v "nodev" | awk '{print $2}'
      register: points_register
      check_mode: no
      changed_when: False
      tags:
        - mount_option_nodev_remote_filesystems
        - medium_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - CCE-27090-0
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
        - DISA-STIG-RHEL-06-000269

    - name: "Add nodev to mount points"
      shell: awk '$2=="{{ item }}"{$4=$4",nodev"}1' /etc/fstab > fstab.tmp && mv fstab.tmp /etc/fstab
      with_items:
        - "{{ points_register.stdout_lines }}"
      when: (points_register.stdout | length > 0) and True
      tags:
        - mount_option_nodev_remote_filesystems
        - medium_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - CCE-27090-0
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
        - DISA-STIG-RHEL-06-000269

    - name: "Get nfs and nfs4 mount points, that don't have nosuid"
      shell: grep -E "[[:space:]]nfs[4]?[[:space:]]" /etc/fstab | grep -v "nosuid" | awk '{print $2}'
      register: points_register
      check_mode: no
      changed_when: False
      tags:
        - mount_option_nosuid_remote_filesystems
        - medium_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - CCE-26972-0
        - NIST-800-53-AC-6
        - DISA-STIG-RHEL-06-000270

    - name: "Add nosuid to mount points"
      shell: awk '$2=="{{ item }}"{$4=$4",nosuid"}1' /etc/fstab > fstab.tmp && mv fstab.tmp /etc/fstab
      with_items:
        - "{{ points_register.stdout_lines }}"
      when: (points_register.stdout | length > 0) and True
      tags:
        - mount_option_nosuid_remote_filesystems
        - medium_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - CCE-26972-0
        - NIST-800-53-AC-6
        - DISA-STIG-RHEL-06-000270

    - name: Enable service ntpd
      service:
        name: ntpd
        enabled: "yes"
        state: "started"
      tags:
        - service_ntpd_enabled
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-27093-4
        - NIST-800-53-AU-8(1)
        - PCI-DSS-Req-10.4
        - DISA-STIG-RHEL-06-000247
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: Ensure xinetd is removed
      package:
        name: xinetd
        state: absent
      tags:
        - package_xinetd_removed
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27005-8
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000204

    - name: Disable service xinetd
      service:
        name: xinetd
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_xinetd_disabled
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27046-2
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - NIST-800-171-3.4.7
        - DISA-STIG-RHEL-06-000203

    - name: Ensure ypserv is removed
      package:
        name: ypserv
        state: absent
      tags:
        - package_ypserv_removed
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27079-3
        - NIST-800-53-CM-7
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7(a)
        - DISA-STIG-RHEL-06-000220

    - name: Disable service ypbind
      service:
        name: ypbind
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_ypbind_disabled
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-26894-6
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000221

    - block:
        - name: "Detect shosts.equiv Files on the System"
          find:
              paths: /
              recurse: yes
              patterns: shosts.equiv
          check_mode: no
          register: shosts_equiv_locations

        - name: "Remove Rsh Trust Files"
          file:
              path: "{{ item.path }}"
              state: absent
          with_items: "{{ shosts_equiv_locations.files }}"
          when: shosts_equiv_locations and True
      tags:
        - no_rsh_trust_files
        - high_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27270-8
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000019

    - name: Ensure rsh-server is removed
      package:
        name: rsh-server
        state: absent
      tags:
        - package_rsh-server_removed
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27062-9
        - NIST-800-53-CM-7
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7(a)
        - DISA-STIG-RHEL-06-000213

    - name: Ensure telnet-server is removed
      package:
        name: telnet-server
        state: absent
      tags:
        - package_telnet-server_removed
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27073-6
        - NIST-800-53-CM-7
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7(a)
        - DISA-STIG-RHEL-06-000206

    - name: Ensure tftp-server is removed
      package:
        name: tftp-server
        state: absent
      tags:
        - package_tftp-server_removed
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-26946-4
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-6(c)
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000222

    - name: Disable service tftp
      service:
        name: tftp
        enabled: "no"
        state: "stopped"
      register: service_result
      failed_when: "service_result is failed and ('Could not find the requested service' not in service_result.msg)"
      tags:
        - service_tftp_disabled
        - medium_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27055-3
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - DISA-STIG-RHEL-06-000223

    - name: Check if /etc/samba/smb.conf exists
      stat:
        path: /etc/samba/smb.conf
      register: st_smb
      tags:
        - require_smb_client_signing
        - unknown_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - CCE-26328-5
        - DISA-STIG-RHEL-06-000272

    - name: Require Client SMB Packet Signing, if using smbclient
      lineinfile:
        dest: /etc/samba/smb.conf
        line: client signing = mandatory
        state: present
        insertafter: [global]
      when: st_smb.stat.exists and True
      tags:
        - require_smb_client_signing
        - unknown_severity
        - configure_strategy
        - low_complexity
        - medium_disruption
        - CCE-26328-5
        - DISA-STIG-RHEL-06-000272

    - name: Disable Host-Based Authentication
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^HostbasedAuthentication
        line: HostbasedAuthentication no
      tags:
        - disable_host_auth
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27091-8
        - NIST-800-53-AC-3
        - NIST-800-53-AC-17
        - NIST-800-53-CM-6(b)
        - NIST-800-171-3.1.12
        - CJIS-5.5.6
        - DISA-STIG-RHEL-06-000236
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: "Allow Only SSH Protocol 2"
      lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "^Protocol [0-9]"
        line: "Protocol 2"
        validate: /usr/sbin/sshd -t -f %s
      #notify: :reload ssh
      tags:
        - sshd_allow_only_protocol2
        - high_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27072-8
        - NIST-800-53-AC-3(10)
        - NIST-800-53-AC-17(b)
        - NIST-800-53-AC-17(8).1(ii)
        - NIST-800-53-IA-5(1)(c)
        - NIST-800-171-3.1.13
        - NIST-800-171-3.5.4
        - CJIS-5.5.6
        - DISA-STIG-RHEL-06-000227
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: Disable SSH Access via Empty Passwords
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^PermitEmptyPasswords
        line: PermitEmptyPasswords no
        validate: /usr/sbin/sshd -t -f %s
      tags:
        - sshd_disable_empty_passwords
        - high_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-26887-0
        - NIST-800-53-AC-3
        - NIST-800-53-AC-6
        - NIST-800-53-AC-17(b)
        - NIST-800-53-CM-6(b)
        - NIST-800-171-3.1.1
        - NIST-800-171-3.1.5
        - CJIS-5.5.6
        - DISA-STIG-RHEL-06-000239
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: Disable SSH Support for .rhosts Files
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^IgnoreRhosts
        line: IgnoreRhosts yes
        validate: /usr/sbin/sshd -t -f %s
      tags:
        - sshd_disable_rhosts
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27124-7
        - NIST-800-53-AC-3
        - NIST-800-53-AC-17(b)
        - NIST-800-53-CM-6(a)
        - NIST-800-171-3.1.12
        - CJIS-5.5.6
        - DISA-STIG-RHEL-06-000234
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: "Disable SSH Root Login"
      lineinfile:
        create: yes
        dest: "/etc/ssh/sshd_config"
        regexp: "^PermitRootLogin"
        line: "PermitRootLogin no"
        insertafter: '(?i)^#?authentication'
        validate: /usr/sbin/sshd -t -f %s
      #notify: restart sshd
      tags:
        - sshd_disable_root_login
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27100-7
        - NIST-800-53-AC-3
        - NIST-800-53-AC-6(2)
        - NIST-800-53-AC-17(b)
        - NIST-800-53-IA-2
        - NIST-800-53-IA-2(5)
        - NIST-800-171-3.1.1
        - NIST-800-171-3.1.5
        - CJIS-5.5.6
        - DISA-STIG-RHEL-06-000237
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: Do Not Allow SSH Environment Options
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^PermitUserEnvironment
        line: PermitUserEnvironment no
        validate: /usr/sbin/sshd -t -f %s
      tags:
        - sshd_do_not_permit_user_env
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27201-3
        - NIST-800-53-AC-17(b)
        - NIST-800-53-CM-6(b)
        - NIST-800-171-3.1.12
        - CJIS-5.5.6
        - DISA-STIG-RHEL-06-000241
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: Enable SSH Warning Banner
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^Banner
        line: Banner /etc/issue
        validate: /usr/sbin/sshd -t -f %s
      tags:
        - sshd_enable_warning_banner
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27112-2
        - NIST-800-53-AC-8(a)
        - NIST-800-53-AC-8(b)
        - NIST-800-53-AC-8(c)(1)
        - NIST-800-53-AC-8(c)(2)
        - NIST-800-53-AC-8(c)(3)
        - NIST-800-53-AC-17(b)
        - NIST-800-171-3.1.9
        - CJIS-5.5.6
        - DISA-STIG-RHEL-06-000240
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: Set SSH Idle Timeout Interval
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^ClientAliveInterval
        line: "ClientAliveInterval {{ sshd_idle_timeout_value }}"
        validate: /usr/sbin/sshd -t -f %s
      #notify: restart sshd
      tags:
        - sshd_set_idle_timeout
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-26919-1
        - NIST-800-53-SA-8
        - NIST-800-53-AC-2(5)
        - NIST-800-53-SA-8(i)
        - NIST-800-53-AC-12
        - NIST-800-53-AC-17(b)
        - NIST-800-171-3.1.11
        - PCI-DSS-Req-8.1.8
        - CJIS-5.5.6
