    - name: get back device associated to mountpoint
      shell: mount | grep ' /dev/shm ' |cut -d ' ' -f 1
      args:
        warn: False # Ignore ANSIBLE0006, we can't fetch device name with mount module
      register: device_name
      check_mode: no
      changed_when: False
      tags:
        - mount_option_dev_shm_nodev
        - medium_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-80837-8
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - block:
      - name: get back device previous mount option
        shell: mount | grep ' /dev/shm ' | sed -re 's:.*\((.*)\):\1:'
        args:
          warn: False # Ignore ANSIBLE0006, we can't fetch current mount options with mount module
        register: device_cur_mountoption
        check_mode: no

      - name: get back device fstype
        shell: mount | grep ' /dev/shm ' | cut -d ' ' -f 5
        args:
          warn: False # Ignore ANSIBLE0006, we can't fetch fstype with mount module
        register: device_fstype
        check_mode: no

      - name: Ensure permission nodev are set on /dev/shm
        mount:
          path: "/dev/shm"
          src: "{{ device_name.stdout }}"
          opts: "{{ device_cur_mountoption.stdout }},nodev"
          state: "mounted"
          fstype: "{{ device_fstype.stdout }}"
      when: (device_name.stdout | length > 0) and (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")
      tags:
        - mount_option_dev_shm_nodev
