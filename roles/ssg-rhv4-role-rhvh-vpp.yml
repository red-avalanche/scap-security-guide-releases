    - name: Check existence of opensc conf
      stat:
        path: /etc/opensc-{{ ansible_architecture }}.conf
      register: opensc_conf_cd

    - name: "Configure opensc Smart Card Drivers"
      lineinfile:
        path: /etc/opensc-{{ ansible_architecture }}.conf
        line: '        card_drivers = {{ var_smartcard_drivers }}'
        regexp: '(^\s+#|^)\s+card_drivers\s+=\s+.*'
        state: present
      when: opensc_conf_cd.stat.exists
      tags:
        - configure_opensc_card_drivers
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-IA-2(2)
        - PCI-DSS-Req-8.3

    -   name: Check existence of pkcs11-switch
        stat:
            path: /usr/bin/pkcs11-switch
        register: pkcs11switch

    - name: Get NSS database smart card configuration
      command: /usr/bin/pkcs11-switch
      changed_when: True
      register: pkcsw_output
      when: pkcs11switch.stat.exists
      tags:
        - configure_opensc_nss_db
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-IA-2(2)
        - PCI-DSS-Req-8.3

    - name: "Configure NSS DB To Use opensc"
      command: /usr/bin/pkcs11-switch opensc
      when: pkcs11switch.stat.exists and pkcsw_output.stdout != "opensc" and True
      tags:
        - configure_opensc_nss_db
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-IA-2(2)
        - PCI-DSS-Req-8.3

    - name: Check existence of opensc conf
      stat:
        path: /etc/opensc-{{ ansible_architecture }}.conf
      register: opensc_conf_fcd

    - name: "Force opensc To Use Defined Smart Card Driver"
      lineinfile:
        path: /etc/opensc-{{ ansible_architecture }}.conf
        line: '        force_card_driver = {{ var_smartcard_drivers }}'
        regexp: '(^\s+#|^)\s+force_card_driver\s+=\s+.*'
        state: present
      when: opensc_conf_fcd.stat.exists
      tags:
        - force_opensc_card_drivers
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-IA-2(2)
        - PCI-DSS-Req-8.3

    - name: Ensure opensc is installed
      package:
        name: opensc
        state: present
      tags:
        - package_opensc_installed
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption

    - name: Enable service pcscd
      service:
        name: pcscd
        enabled: "yes"
        state: "started"
      tags:
        - service_pcscd_enabled
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption

    - name: Verify that Interactive Boot is Disabled in /etc/default/grub
      replace:
        dest: /etc/default/grub
        regexp: systemd.confirm_spawn=(1|yes|true|on)
        replace: systemd.confirm_spawn=no
      tags:
        - grub2_disable_interactive_boot
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-SC-2
        - NIST-800-53-AC-3
        - NIST-800-171-3.1.2
        - NIST-800-171-3.4.5
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: Verify that Interactive Boot is Disabled (runtime)
      command: /sbin/grubby --update-kernel=ALL --remove-args="systemd.confirm_spawn"
      tags:
        - grub2_disable_interactive_boot
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-SC-2
        - NIST-800-53-AC-3
        - NIST-800-171-3.1.2
        - NIST-800-171-3.4.5
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: Set Account Expiration Following Inactivity
      lineinfile:
        create: yes
        dest: /etc/default/useradd
        regexp: ^INACTIVE
        line: "INACTIVE={{ var_account_disable_post_pw_expiration }}"
      tags:
        - account_disable_post_pw_expiration
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-2(2)
        - NIST-800-53-AC-2(3)
        - NIST-800-53-IA-4(e)
        - NIST-800-171-3.5.6
        - PCI-DSS-Req-8.1.4
        - CJIS-5.6.2.1.1

    - name: Set Password Maximum Age
      lineinfile:
        create: yes
        dest: /etc/login.defs
        regexp: ^#?PASS_MAX_DAYS
        line: "PASS_MAX_DAYS {{ var_accounts_maximum_age_login_defs }}"
      tags:
        - accounts_maximum_age_login_defs
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-IA-5(f)
        - NIST-800-53-IA-5(g)
