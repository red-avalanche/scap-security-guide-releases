###############################################################################
#
# Ansible remediation role for profile server
# Profile Title:  Server Baseline
# Profile Description:
# This profile is for SUSE Enterprise Linux 11 acting as a server.
#
# Benchmark ID:  SUSE-11
# Benchmark Version:  0.1.38
#
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.2.16 using:
# 	$ oscap xccdf generate fix --profile server --template urn:xccdf:fix:script:ansible sds.xml 
#
# This script is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this remediation role:
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################


 - hosts: all
   pre_tasks:
     - name: Verify Ansible meets SCAP-Security-Guide version requirements.
       assert:
         that: "ansible_version.full | version_compare('2.3', '>=')"
         msg: >
           "You must update Ansible to at least version 2.3 to use this role."
          
   vars:
   tasks:
    
    - name: Find /etc/passwd file(s)
      find:
        paths: "{{ '/etc/passwd' | dirname }}"
        patterns: "{{ '/etc/passwd' | basename }}"
      register: files_found
      tags:
        - file_owner_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    - name: Set user ownership to root
      file:
        path: "{{ item.path }}"
        owner: root
      with_items:
        - "{{ files_found.files }}"
      tags:
        - file_owner_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    
    
    - name: Find /etc/passwd file(s)
      find:
        paths: "{{ '/etc/passwd' | dirname }}"
        patterns: "{{ '/etc/passwd' | basename }}"
      register: files_found
      tags:
        - file_groupowner_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    - name: Set group ownership to root
      file:
        path: "{{ item.path }}"
        group: root
      with_items:
        - "{{ files_found.files }}"
      tags:
        - file_groupowner_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    
    
    - name: Find /etc/passwd file(s)
      find:
        paths: "{{ '/etc/passwd' | dirname }}"
        patterns: "{{ '/etc/passwd' | basename }}"
      register: files_found
      tags:
        - file_permissions_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    - name: Set permissions
      file:
        path: "{{ item.path }}"
        mode: 0644
      with_items:
        - "{{ files_found.files }}"
      tags:
        - file_permissions_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    
