# Ansible remediation role for profile anssi_np_nt28_minimal
# Profile Title:  Profile for ANSSI DAT-NT28 Minimal Level
# Profile Description:  This profile contains items to be applied systematically.
#
# Benchmark ID:  DEBIAN-8
