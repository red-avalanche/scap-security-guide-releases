# - hosts: localhost # set required host
   tasks:
    - name: Ensure permission 0640 on /etc/shadow
      file:
        path="{{item}}"
        mode=0640
      with_items:
        - /etc/shadow
      tags:
        - file_permissions_etc_shadow
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
    
    
    - name: Ensure permission 0640 on /etc/gshadow
      file:
        path="{{item}}"
        mode=0640
      with_items:
        - /etc/gshadow
      tags:
        - file_permissions_etc_gshadow
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
    
    
    - name: Ensure permission 0644 on /etc/passwd
      file:
        path="{{item}}"
        mode=0644
      with_items:
        - /etc/passwd
      tags:
        - file_permissions_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
    
    
    - name: Ensure permission 0644 on /etc/group
      file:
        path="{{item}}"
        mode=0644
      with_items:
        - /etc/group
      tags:
        - file_permissions_etc_group
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
    
    
    - name: Ensure rsyslog is installed
      package:
        name="{{item}}"
        state=present
      with_items:
        - rsyslog
      tags:
        - package_rsyslog_installed
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AU-9(2)
    
    
    - name: Enable service rsyslog
      service:
        name="{{item}}"
        enabled="yes"
        state="started"
      with_items:
        - rsyslog
      tags:
        - service_rsyslog_enabled
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AU-4(1)
        - NIST-800-53-AU-12
    
    
    - name: Ensure telnetd is removed
      package:
        name="{{item}}"
        state=absent
      with_items:
        - telnetd
      tags:
        - package_telnetd_removed
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
    
    
    - name: Ensure inetutils-telnetd is removed
      package:
        name="{{item}}"
        state=absent
      with_items:
        - inetutils-telnetd
      tags:
        - package_inetutils-telnetd_removed
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
    
    
    - name: Ensure telnetd-ssl is removed
      package:
        name="{{item}}"
        state=absent
      with_items:
        - telnetd-ssl
      tags:
        - package_telnetd-ssl_removed
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
    
    
    - name: Ensure nis is removed
      package:
        name="{{item}}"
        state=absent
      with_items:
        - nis
      tags:
        - package_nis_removed
        - low_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-
    
    
