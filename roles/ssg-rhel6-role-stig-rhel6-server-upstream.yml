---
###############################################################################
#
# Ansible remediation role for profile stig-rhel6-server-upstream
# Profile Title:  DISA STIG for Red Hat Enterprise Linux 6
# Profile Description:
# This profile contains items common to general-purpose
# desktop and server installations.
# This profile contains configuration checks that align to the
# DISA STIG for Red Hat Enterprise Linux 6.
# 
# In addition to being applicable to RHEL6, DISA recognizes this
# configuration baseline as applicable to the operating system
# tier of Red Hat technologies that are based off RHEL6, such as RHEL
# Server,  RHV-H, RHEL for HPC, RHEL Workstation, and Red Hat
# Storage deployments.
# 
#
# Benchmark ID:  RHEL-6
# Benchmark Version:  0.1.37
#
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.2.16 using:
# 	$ oscap xccdf generate fix --profile stig-rhel6-server-upstream --template urn:xccdf:fix:script:ansible sds.xml 
#
# This script is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this remediation role:
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################


 - hosts: all
   vars:
      var_selinux_state: enforcing
      var_selinux_policy_name: targeted
      var_accounts_password_minlen_login_defs: 15
      var_accounts_minimum_age_login_defs: 1
      var_accounts_maximum_age_login_defs: 60
      var_accounts_password_warn_age_login_defs: 7
      var_account_disable_post_pw_expiration: 35
      var_password_pam_retry: 3
      var_password_pam_maxrepeat: 3
      var_password_pam_unix_remember: 5
      var_accounts_tmout: 600
      var_accounts_max_concurrent_login_sessions: 10
      var_accounts_user_umask: 077
      sysctl_net_ipv4_conf_all_accept_source_route_value: 0
      sysctl_net_ipv4_conf_all_accept_redirects_value: 0
      sysctl_net_ipv4_conf_all_secure_redirects_value: 0
      sysctl_net_ipv4_conf_all_log_martians_value: 1
      sysctl_net_ipv4_conf_default_accept_source_route_value: 0
      sysctl_net_ipv4_conf_default_accept_redirects_value: 0
      sysctl_net_ipv4_conf_default_secure_redirects_value: 0
      sysctl_net_ipv4_icmp_echo_ignore_broadcasts_value: 1
      sysctl_net_ipv4_icmp_ignore_bogus_error_responses_value: 1
      sysctl_net_ipv4_tcp_syncookies_value: 1
      sysctl_net_ipv4_conf_all_rp_filter_value: 1
      sysctl_net_ipv4_conf_default_rp_filter_value: 1
      sysctl_net_ipv6_conf_default_accept_redirects_value: 0
      rsyslog_remote_loghost_address: NULL
      var_auditd_max_log_file: 6
      var_auditd_max_log_file_action: rotate
      var_auditd_space_left_action: email
      var_auditd_admin_space_left_action: single
      var_auditd_action_mail_acct: root
      sshd_idle_timeout_value: 900
   tasks:
    - name: "Read permission of GPG key directory"
      stat:
        path: /etc/pki/rpm-gpg/
      register: gpg_key_directory_permission
      check_mode: no
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    # It should fail if it doesn't find any fingerprints in file - maybe file was not parsed well.
    
    - name: Read signatures in GPG key
      shell: gpg --with-fingerprint '/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release' | grep 'Key fingerprint =' | tr -s ' ' | sed 's;.*= ;;g'
      changed_when: False
      register: gpg_fingerprints
      check_mode: no
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    - name: Set Fact - Valid fingerprints
      set_fact:
         gpg_valid_fingerprints: ("567E 347A D004 4ADE 55BA 8A5F 199E 2F91 FD43 1D51" "43A6 E49C 4A38 F4BE 9ABF 2A53 4568 9C88 2FA6 58E0")
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    - name: Import RedHat GPG key
      rpm_key:
        state: present
        key: /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
      when:
        (gpg_key_directory_permission.stat.mode <= '0755')
        and (( gpg_fingerprints.stdout_lines | difference(gpg_valid_fingerprints)) | length == 0)
        and (gpg_fingerprints.stdout_lines | length > 0)
        and (ansible_distribution == "RedHat")
      tags:
        - ensure_redhat_gpgkey_installed
        - high_severity
        - restrict_strategy
        - medium_complexity
        - medium_disruption
        - CCE-26506-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000008
    
    - name: Check existence of yum on Fedora
      stat:
        path: /etc/yum.conf
      register: yum_config_file
      check_mode: no
      when: ansible_distribution == "Fedora"
    
    # Old versions of Fedora use yum
    
    - name: Ensure GPG check is globally activated (yum)
      ini_file:
        dest: "{{item}}"
        section: main
        option: gpgcheck
        value: 1
        create: False
      with_items: "/etc/yum.conf"
      when: ansible_distribution == "RedHat" or ansible_distribution == "CentOS" or yum_config_file.stat.exists
      tags:
        - ensure_gpgcheck_globally_activated
        - medium_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - CCE-26709-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000013
    
    - name: Ensure GPG check is globally activated (dnf)
      ini_file:
        dest: "{{item}}"
        section: main
        option: gpgcheck
        value: 1
        create: False
      with_items: "/etc/dnf/dnf.conf"
      when: ansible_distribution == "Fedora"
      tags:
        - ensure_gpgcheck_globally_activated
        - medium_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - CCE-26709-6
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000013
    
    
    #
    - name: Find All Yum Repositories
      find:
        paths: "/etc/yum.repos.d/"
        patterns: "*.repo"
      register: yum_find
    
    - name: Ensure gpgcheck Enabled For All Yum Package Repositories
      with_items: "{{ yum_find.files }}"
      lineinfile:
        create: yes
        dest: "{{ item.path }}"
        regexp: '^gpgcheck'
        line: 'gpgcheck=1'
      tags:
        - ensure_gpgcheck_never_disabled
        - low_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - CCE-26647-8
        - NIST-800-53-SI-7
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000015
    
    - name: "Security patches are up to date"
      package:
        name: "*"
        state: "latest"
      tags:
        - security_patches_up_to_date
        - medium_severity
        - patch_strategy
        - low_complexity
        - high_disruption
        - CCE-27635-2
        - NIST-800-53-SI-2
        - NIST-800-53-MA-1(b)
        - PCI-DSS-Req-6.2
        - DISA-STIG-RHEL-06-000011
    
    
    - name: Ensure aide is installed
      package:
        name="{{item}}"
        state=present
      with_items:
        - aide
      tags:
        - package_aide_installed
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-27024-9
        - NIST-800-53-CM-3(d)
        - NIST-800-53-CM-3(e)
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SC-28
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000016
    
    
    - name: "Ensure AIDE is installed"
      package:
        name="{{item}}"
        state=present
      with_items:
        - aide
      tags:
        - aide_periodic_cron_checking
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27222-9
        - NIST-800-53-CM-3(d)
        - NIST-800-53-CM-3(e)
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SC-28
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000306
    
    - name: "Configure Periodic Execution of AIDE"
      cron:
        name: "run AIDE check"
        minute: 05
        hour: 04
        weekday: 0
        user: root
        job: "/usr/sbin/aide --check"
      tags:
        - aide_periodic_cron_checking
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27222-9
        - NIST-800-53-CM-3(d)
        - NIST-800-53-CM-3(e)
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SC-28
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000306
    - name: "Read list of files with incorrect permissions"
      shell: "rpm -Va | grep '^.M' | cut -d ' ' -f5- | sed -r 's;^.*\\s+(.+);\\1;g'"
      register: files_with_incorrect_permissions
      failed_when: False
      changed_when: False
      check_mode: no
      tags:
        - rpm_verify_permissions
        - low_severity
        - restrict_strategy
        - high_complexity
        - medium_disruption
        - CCE-26731-0
        - NIST-800-53-AC-6
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000518
    
    - name: "Correct file permissions with RPM"
      shell: "rpm --setperms $(rpm -qf '{{item}}')"
      with_items: "{{ files_with_incorrect_permissions.stdout_lines }}"
      when: files_with_incorrect_permissions.stdout_lines | length > 0
      tags:
        - rpm_verify_permissions
        - low_severity
        - restrict_strategy
        - high_complexity
        - medium_disruption
        - CCE-26731-0
        - NIST-800-53-AC-6
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000518
    
    
    - name: "Set fact: Package manager reinstall command (dnf)"
      set_fact:
        package_manager_reinstall_cmd: dnf reinstall -y
      when: ansible_distribution == "Fedora"
      tags:
        - rpm_verify_hashes
        - low_severity
        - unknown_strategy
        - high_complexity
        - medium_disruption
        - CCE-27223-7
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000519
    
    - name: "Set fact: Package manager reinstall command (yum)"
      set_fact:
        package_manager_reinstall_cmd: yum reinstall -y
      when: ansible_distribution == "RedHat"
      tags:
        - rpm_verify_hashes
        - low_severity
        - unknown_strategy
        - high_complexity
        - medium_disruption
        - CCE-27223-7
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000519
    
    - name: "Read files with incorrect hash"
      shell: "rpm -Va | grep -E '^..5.* /(bin|sbin|lib|lib64|usr)/' | sed -r 's;^.*\\s+(.+);\\1;g'"
      register: files_with_incorrect_hash
      changed_when: False
      when: package_manager_reinstall_cmd is defined
      check_mode: no
      tags:
        - rpm_verify_hashes
        - low_severity
        - unknown_strategy
        - high_complexity
        - medium_disruption
        - CCE-27223-7
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000519
    
    - name: "Reinstall packages of files with incorrect hash"
      shell: "{{package_manager_reinstall_cmd}} $(rpm -qf '{{item}}')"
      with_items: "{{ files_with_incorrect_hash.stdout_lines }}"
      when: package_manager_reinstall_cmd is defined and (files_with_incorrect_hash.stdout_lines | length > 0)
      tags:
        - rpm_verify_hashes
        - low_severity
        - unknown_strategy
        - high_complexity
        - medium_disruption
        - CCE-27223-7
        - NIST-800-53-CM-6(d)
        - NIST-800-53-SI-7
        - PCI-DSS-Req-11.5
        - DISA-STIG-RHEL-06-000519
    
    
    - name: get back device associated to mountpoint
      shell: mount | grep ' /tmp ' |cut -d ' ' -f 1
      register: device_name
      check_mode: no
      tags:
        - mount_option_tmp_noexec
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26720-3
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
        - DISA-STIG-RHEL-06-000528
    
    - name: get back device previous mount option
      shell: mount | grep ' /tmp ' | sed -re 's:.*\((.*)\):\1:'
      register: device_cur_mountoption
      check_mode: no
      tags:
        - mount_option_tmp_noexec
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26720-3
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
        - DISA-STIG-RHEL-06-000528
    
    - name: get back device fstype
      shell: mount | grep ' /tmp ' | cut -d ' ' -f 5
      register: device_fstype
      check_mode: no
      tags:
        - mount_option_tmp_noexec
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26720-3
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
        - DISA-STIG-RHEL-06-000528
    
    - name: Ensure permission noexec are set on /tmp
      mount:
        path: "/tmp"
        src: "{{device_name.stdout}}"
        opts: "{{device_cur_mountoption.stdout}},noexec"
        state: "mounted"
        fstype: "{{device_fstype.stdout}}"
      tags:
        - mount_option_tmp_noexec
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26720-3
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
        - DISA-STIG-RHEL-06-000528
    
    
    - name: get back device associated to mountpoint
      shell: mount | grep ' /dev/shm ' |cut -d ' ' -f 1
      register: device_name
      check_mode: no
      tags:
        - mount_option_dev_shm_nodev
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26778-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    - name: get back device previous mount option
      shell: mount | grep ' /dev/shm ' | sed -re 's:.*\((.*)\):\1:'
      register: device_cur_mountoption
      check_mode: no
      tags:
        - mount_option_dev_shm_nodev
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26778-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    - name: get back device fstype
      shell: mount | grep ' /dev/shm ' | cut -d ' ' -f 5
      register: device_fstype
      check_mode: no
      tags:
        - mount_option_dev_shm_nodev
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26778-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    - name: Ensure permission nodev are set on /dev/shm
      mount:
        path: "/dev/shm"
        src: "{{device_name.stdout}}"
        opts: "{{device_cur_mountoption.stdout}},nodev"
        state: "mounted"
        fstype: "{{device_fstype.stdout}}"
      tags:
        - mount_option_dev_shm_nodev
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26778-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    
    - name: get back device associated to mountpoint
      shell: mount | grep ' /dev/shm ' |cut -d ' ' -f 1
      register: device_name
      check_mode: no
      tags:
        - mount_option_dev_shm_noexec
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26622-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    - name: get back device previous mount option
      shell: mount | grep ' /dev/shm ' | sed -re 's:.*\((.*)\):\1:'
      register: device_cur_mountoption
      check_mode: no
      tags:
        - mount_option_dev_shm_noexec
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26622-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    - name: get back device fstype
      shell: mount | grep ' /dev/shm ' | cut -d ' ' -f 5
      register: device_fstype
      check_mode: no
      tags:
        - mount_option_dev_shm_noexec
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26622-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    - name: Ensure permission noexec are set on /dev/shm
      mount:
        path: "/dev/shm"
        src: "{{device_name.stdout}}"
        opts: "{{device_cur_mountoption.stdout}},noexec"
        state: "mounted"
        fstype: "{{device_fstype.stdout}}"
      tags:
        - mount_option_dev_shm_noexec
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26622-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    
    - name: get back device associated to mountpoint
      shell: mount | grep ' /dev/shm ' |cut -d ' ' -f 1
      register: device_name
      check_mode: no
      tags:
        - mount_option_dev_shm_nosuid
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26486-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    - name: get back device previous mount option
      shell: mount | grep ' /dev/shm ' | sed -re 's:.*\((.*)\):\1:'
      register: device_cur_mountoption
      check_mode: no
      tags:
        - mount_option_dev_shm_nosuid
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26486-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    - name: get back device fstype
      shell: mount | grep ' /dev/shm ' | cut -d ' ' -f 5
      register: device_fstype
      check_mode: no
      tags:
        - mount_option_dev_shm_nosuid
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26486-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    - name: Ensure permission nosuid are set on /dev/shm
      mount:
        path: "/dev/shm"
        src: "{{device_name.stdout}}"
        opts: "{{device_cur_mountoption.stdout}},nosuid"
        state: "mounted"
        fstype: "{{device_fstype.stdout}}"
      tags:
        - mount_option_dev_shm_nosuid
        - low_severity
        - configure_strategy
        - low_complexity
        - high_disruption
        - CCE-26486-1
        - NIST-800-53-CM-7
        - NIST-800-53-MP-2
    
    
    - name: Ensure kernel module 'usb-storage' is disabled
      lineinfile:
        create=yes
        dest="/etc/modprobe.d/{{item}}.conf"
        regexp="{{item}}"
        line="install {{item}} /bin/true"
      with_items:
        - usb-storage
      tags:
        - kernel_module_usb-storage_disabled
        - low_severity
        - disable_strategy
        - low_complexity
        - medium_disruption
        - CCE-27016-5
        - NIST-800-53-AC-19(a)
        - NIST-800-53-AC-19(d)
        - NIST-800-53-AC-19(e)
        - DISA-STIG-RHEL-06-000503
    
    
    - name: Disable service autofs
      service:
        name="{{item}}"
        enabled="no"
        state="stopped"
      with_items:
        - autofs
      tags:
        - service_autofs_disabled
        - low_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-26976-1
        - NIST-800-53-AC-19(a)
        - NIST-800-53-AC-19(d)
        - NIST-800-53-AC-19(e)
        - DISA-STIG-RHEL-06-000526
    
    
    - name: Ensure permission 0000 on /etc/shadow
      file:
        path="{{item}}"
        mode=0000
      with_items:
        - /etc/shadow
      tags:
        - file_permissions_etc_shadow
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - CCE-26992-8
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - DISA-STIG-RHEL-06-000035
    
    
    
    - name: Find /etc/group file(s)
      find:
        paths: "{{ '/etc/group' | dirname }}"
        patterns: "{{ '/etc/group' | basename }}"
      register: files_found
      tags:
        - file_owner_etc_group
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
