    - name: "Allow Only SSH Protocol 2"
      lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "^Protocol [0-9]"
        line: "Protocol 2"
        validate: sshd -t -f %s
      #notify: :reload ssh
      tags:
        - sshd_allow_only_protocol2
        - high_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27072-8
        - NIST-800-53-AC-3(10)
        - NIST-800-53-IA-5(1)(c)
        - DISA-STIG-RHEL-06-000227
    
    - name: Print last log
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^PrintLastLog
        line: PrintLastLog yes
        validate: sshd -t -f %s
      #notify: restart sshd
      tags:
        - sshd_print_last_log
        - medium_severity
        - CCE-80504-4
        - NIST-800-53-AC-9
        - DISA-STIG-RHEL-06-000507
    
    
    
    - name: Set SSH Idle Timeout Interval
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^ClientAliveInterval
        line: "ClientAliveInterval {{ sshd_idle_timeout_value }}"
        validate: sshd -t -f %s
      #notify: restart sshd
      tags:
        - sshd_set_idle_timeout
        - low_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-26919-1
        - NIST-800-53-AC-2(5)
        - NIST-800-53-SA-8
        - PCI-DSS-Req-8.1.8
        - DISA-STIG-RHEL-06-000230
    
    - name: Set SSH Client Alive Count
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^ClientAliveCountMax
        line: ClientAliveCountMax 0
        validate: sshd -t -f %s
      #notify: restart sshd
      tags:
        - sshd_set_keepalive
        - low_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-26282-4
        - NIST-800-53-AC-2(5)
        - NIST-800-53-SA-8
        - DISA-STIG-RHEL-06-000231
    
    - name: Disable SSH Support for .rhosts Files
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^IgnoreRhosts
        line: IgnoreRhosts yes
        validate: sshd -t -f %s
      tags:
        - sshd_disable_rhosts
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27124-7
        - NIST-800-53-AC-3
        - DISA-STIG-RHEL-06-000234
    
    - name: Disable Host-Based Authentication
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^HostbasedAuthentication
        line: HostbasedAuthentication no
      tags:
        - disable_host_auth
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27091-8
        - NIST-800-53-AC-3
        - DISA-STIG-RHEL-06-000236
    
    - name: "Disable SSH Root Login"
      lineinfile:
        create: yes
        dest: "/etc/ssh/sshd_config"
        regexp: "^PermitRootLogin"
        line: "PermitRootLogin no"
        insertafter: '(?i)^#?authentication'
        validate: sshd -t -f %s
      #notify: restart sshd
      tags:
        - sshd_disable_root_login
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27100-7
        - NIST-800-53-AC-3
        - NIST-800-53-AC-6(2)
        - NIST-800-53-IA-2(1)
        - DISA-STIG-RHEL-06-000237
    
    - name: Disable SSH Access via Empty Passwords
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^PermitEmptyPasswords
        line: PermitEmptyPasswords no
        validate: sshd -t -f %s
      tags:
        - sshd_disable_empty_passwords
        - high_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-26887-0
        - NIST-800-53-AC-3
        - DISA-STIG-RHEL-06-000239
    
    - name: Enable SSH Warning Banner
      lineinfile:
        create: yes
        dest: /etc/ssh/sshd_config
        regexp: ^Banner
        line: Banner /etc/issue
        validate: sshd -t -f %s
      tags:
        - sshd_enable_warning_banner
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
        - CCE-27112-2
        - NIST-800-53-AC-8(a)
        - DISA-STIG-RHEL-06-000240
    
    - name: Do Not Allow SSH Environment Options
