        path: /etc/dconf/db/local.d/locks/00-security-settings-lock
        regexp: '^/org/gnome/desktop/screensaver/lock-enabled'
        line: '/org/gnome/desktop/screensaver/lock-enabled'
        create: yes
      tags:
        - dconf_gnome_screensaver_lock_enabled
        - medium_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - NIST-800-53-AC-11(b)
        - NIST-800-171-3.1.10
        - PCI-DSS-Req-8.1.8
        - CJIS-5.5.5
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: "Implement Blank Screensaver"
      ini_file:
        dest: "/etc/dconf/db/local.d/00-security-settings"
        section: "org/gnome/desktop/screensaver"
        option: picture-uri
        value: string ''
        create: yes
      tags:
        - dconf_gnome_screensaver_mode_blank
        - medium_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - NIST-800-53-AC-11(b)
        - NIST-800-171-3.1.10
        - PCI-DSS-Req-8.1.8
        - CJIS-5.5.5
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: "Prevent user modification of GNOME picture-uri"
      lineinfile:
        path: /etc/dconf/db/local.d/locks/00-security-settings-lock
        regexp: '^/org/gnome/desktop/screensaver/picture-uri'
        line: '/org/gnome/desktop/screensaver/picture-uri'
        create: yes
      tags:
        - dconf_gnome_screensaver_mode_blank
        - medium_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
        - NIST-800-53-AC-11(b)
        - NIST-800-171-3.1.10
        - PCI-DSS-Req-8.1.8
        - CJIS-5.5.5
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: "Remove the existing \"use textfile backend\" directive from the config - it may not be at the file's very top"
      lineinfile:
        path: '/etc/dconf/profile/user'
        regexp: '^service-db:keyfile/user.*'
        state: 'absent'
      check_mode: no
      tags:
        - dconf_use_text_backend
        - high_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: "Insert the \" use textfiles backend\" directive at the top of the config file"
      lineinfile:
        path: '/etc/dconf/profile/user'
        regexp: '^service-db:keyfile/user$'
        line: 'service-db:keyfile/user'
        insertbefore: 'BOF'
        create: yes
      check_mode: no
      tags:
        - dconf_use_text_backend
        - high_severity
        - unknown_strategy
        - low_complexity
        - medium_disruption
      when:  # Bare-metal/VM task, not applicable for containers
        - (ansible_virtualization_role != "guest" or ansible_virtualization_type != "docker")

    - name: "Configure System Cryptography Policy"
      lineinfile:
        path: /etc/crypto-policies/config
        regexp: '^(?!#)(\S+)$'
        line: "{{ var_system_crypto_policy }}"
        create: yes
      tags:
        - configure_crypto_policy
        - high_severity
        - restrict_strategy
        - low_complexity
        - low_disruption

    - name: Verify that Crypto Policy is Set (runtime)
      shell: /usr/bin/update-crypto-policies --set {{ var_system_crypto_policy }}

    - name: "Configure SSH to use System Crypto Policy"
      lineinfile:
        dest: /etc/sysconfig/sshd
        state: absent
        regexp: ^\s*CRYPTO_POLICY.*$
      tags:
        - configure_ssh_crypto_policy
        - medium_severity
        - disable_strategy
        - low_complexity
        - medium_disruption

    - name: "Configure Libreswan to use System Crypto Policy"
      lineinfile:
        path: /etc/ipsec.conf
        line: "include /etc/crypto-policies/back-ends/libreswan.config"
        create: yes
      tags:
        - configure_libreswan_crypto_policy
        - medium_severity
        - restrict_strategy
        - low_complexity
        - low_disruption

    - name: "Configure Kerberos to use System Crypto Policy"
      file:
        src: /etc/crypto-policies/back-ends/krb5.config
        path: /etc/krb5.conf.d/crypto-policies
        state: link
      tags:
        - configure_kerberos_crypto_policy
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption

