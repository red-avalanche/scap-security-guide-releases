---
###############################################################################
#
# Ansible remediation role for profile standard
# Profile Title:  Standard System Security Profile for Ubuntu 14
# Profile Description:
# This profile contains rules to ensure standard security baseline
# of a Ubuntu 14 system. Regardless of your system's workload
# all of these checks should pass.
#
# Benchmark ID:  UBUNTU-TRUSTY
# Benchmark Version:  0.1.39
#
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.2.16 using:
# 	$ oscap xccdf generate fix --profile standard --template urn:xccdf:fix:script:ansible sds.xml 
#
# This script is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this remediation role:
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################


 - hosts: all
   pre_tasks:
     - name: Verify Ansible meets SCAP-Security-Guide version requirements.
       assert:
         that: "ansible_version.full | version_compare('2.3', '>=')"
         msg: >
           "You must update Ansible to at least version 2.3 to use this role."
          
   vars:
   tasks:
    - name: Ensure nis is removed
      package:
        name="{{item}}"
        state=absent
      with_items:
        - nis
      tags:
        - package_nis_removed
        - low_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-
    
    - name: Ensure telnetd is removed
      package:
        name="{{item}}"
        state=absent
      with_items:
        - telnetd
      tags:
        - package_telnetd_removed
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
    
    - name: Ensure ntpdate is removed
      package:
        name="{{item}}"
        state=absent
      with_items:
        - ntpdate
      tags:
        - package_ntpdate_removed
        - low_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-
    
    - name: Ensure telnetd-ssl is removed
      package:
        name="{{item}}"
        state=absent
      with_items:
        - telnetd-ssl
      tags:
        - package_telnetd-ssl_removed
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
    
    - name: Ensure inetutils-telnetd is removed
      package:
        name="{{item}}"
        state=absent
      with_items:
        - inetutils-telnetd
      tags:
        - package_inetutils-telnetd_removed
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
    
    - name: Enable service cron
      service:
        name="{{item}}"
        enabled="yes"
        state="started"
      with_items:
        - cron
      tags:
        - service_cron_enabled
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-CM-7
    
    - name: Ensure ntp is installed
      package:
        name="{{item}}"
        state=present
      with_items:
        - ntp
      tags:
        - package_ntp_installed
        - high_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-AU-8(1)
        - PCI-DSS-Req-10.4
    
    - name: Ensure cron is installed
      package:
        name="{{item}}"
        state=present
      with_items:
        - cron
      tags:
        - package_cron_installed
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-CM-7
    
    - name: Ensure auditd is installed
      package:
        name="{{item}}"
        state=present
      with_items:
        - auditd
      tags:
        - package_auditd_installed
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-
    
    - name: Enable service ntpd
      service:
        name="{{item}}"
        enabled="yes"
        state="started"
      with_items:
        - ntpd
      tags:
        - service_ntpd_enabled
        - high_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-AU-8(1)
        - PCI-DSS-Req-10.4
    
    - name: Enable service auditd
      service:
        name="{{item}}"
        enabled="yes"
        state="started"
      with_items:
        - auditd
      tags:
        - service_auditd_enabled
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-
        - NIST-800-53-AC-17(1)
        - NIST-800-53-AU-1(b)
        - NIST-800-53-AU-10
        - NIST-800-53-AU-12(a)
        - NIST-800-53-AU-12(c)
        - NIST-800-53-IR-5
        - PCI-DSS-Req-10
    
    - name: Enable service rsyslog
      service:
        name="{{item}}"
        enabled="yes"
        state="started"
      with_items:
        - rsyslog
      tags:
        - service_rsyslog_enabled
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AU-4(1)
        - NIST-800-53-AU-12
    
    - name: Ensure rsyslog is installed
      package:
        name="{{item}}"
        state=present
      with_items:
        - rsyslog
      tags:
        - package_rsyslog_installed
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AU-9(2)
    
    - name: Ensure sysctl fs.protected_hardlinks is set to 1
      sysctl:
        name: fs.protected_hardlinks
        value: 1
        state: present
        reload: yes
      tags:
        - sysctl_fs_protected_hardlinks
        - unknown_severity
        - disable_strategy
        - low_complexity
        - medium_disruption
        - NIST-800-53-SI-11
    
    - name: Ensure sysctl fs.protected_symlinks is set to 1
      sysctl:
        name: fs.protected_symlinks
        value: 1
        state: present
        reload: yes
      tags:
        - sysctl_fs_protected_symlinks
        - unknown_severity
        - disable_strategy
        - low_complexity
        - medium_disruption
        - NIST-800-53-SI-11
    
    - name: Ensure permission 0644 on /etc/group
      file:
        path="{{item}}"
        mode=0644
      with_items:
        - /etc/group
      tags:
        - file_permissions_etc_group
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
    
    - name: Ensure permission 0640 on /etc/shadow
      file:
        path="{{item}}"
        mode=0640
      with_items:
        - /etc/shadow
      tags:
        - file_permissions_etc_shadow
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
    
    - name: Ensure permission 0640 on /etc/gshadow
      file:
        path="{{item}}"
        mode=0640
      with_items:
        - /etc/gshadow
      tags:
        - file_permissions_etc_gshadow
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
    
    - name: Ensure permission 0644 on /etc/passwd
      file:
        path="{{item}}"
        mode=0644
      with_items:
        - /etc/passwd
      tags:
        - file_permissions_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-6
    
    - name: Ensure sysctl fs.suid_dumpable is set to 0
      sysctl:
        name: fs.suid_dumpable
        value: 0
        state: present
        reload: yes
      tags:
        - sysctl_fs_suid_dumpable
        - unknown_severity
        - disable_strategy
        - low_complexity
        - medium_disruption
        - NIST-800-53-SI-11
    
    - name: Ensure sysctl kernel.randomize_va_space is set to 2
      sysctl:
        name: kernel.randomize_va_space
        value: 2
        state: present
        reload: yes
      tags:
        - sysctl_kernel_randomize_va_space
        - medium_severity
        - disable_strategy
        - low_complexity
        - medium_disruption
        - NIST-800-53-SC-30(2)
    
