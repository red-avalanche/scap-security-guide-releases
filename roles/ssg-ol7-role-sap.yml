---
###############################################################################
#
# Ansible remediation role for profile sap
# Profile Title:  Security Profile of Oracle Linux 7 for SAP
# Profile Description:
# This profile contains rules for Oracle Linux 7 Operating System
# in compliance with SAP note 2069760 and SAP Security Baseline v1.9
# Item I-8 and section 4.1.2.2. Regardless of your system's workload
# all of these checks should pass.
#
# Benchmark ID:  OL-7
# Benchmark Version:  0.1.39
#
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.2.16 using:
# 	$ oscap xccdf generate fix --profile sap --template urn:xccdf:fix:script:ansible sds.xml 
#
# This script is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this remediation role:
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################


 - hosts: all
   pre_tasks:
     - name: Verify Ansible meets SCAP-Security-Guide version requirements.
       assert:
         that: "ansible_version.full | version_compare('2.3', '>=')"
         msg: >
           "You must update Ansible to at least version 2.3 to use this role."
          
   vars:
   tasks:
    - name: Disable service rlogin
      service:
        name="{{item}}"
        enabled="no"
        state="stopped"
      register: service_result
      failed_when: "service_result|failed and ('Could not find the requested service' not in service_result.msg)"
      with_items:
        - rlogin
      tags:
        - service_rlogin_disabled
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - NIST-800-53-IA-5(1)(c)
        - NIST-800-171-3.1.13
        - NIST-800-171-3.4.7
    
    - name: Disable service rsh
      service:
        name="{{item}}"
        enabled="no"
        state="stopped"
      register: service_result
      failed_when: "service_result|failed and ('Could not find the requested service' not in service_result.msg)"
      with_items:
        - rsh
      tags:
        - service_rsh_disabled
        - high_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - NIST-800-53-AC-17(8)
        - NIST-800-53-CM-7
        - NIST-800-53-IA-5(1)(c)
        - NIST-800-171-3.1.13
        - NIST-800-171-3.4.7
    
    - name: Ensure uuidd is installed
      package:
        name="{{item}}"
        state=present
      with_items:
        - uuidd
      tags:
        - package_uuidd_installed
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
    
    - name: Ensure glibc is installed
      package:
        name="{{item}}"
        state=present
      with_items:
        - glibc
      tags:
        - package_glibc_installed
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
    
