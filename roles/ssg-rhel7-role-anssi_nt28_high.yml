---
###############################################################################
#
# Ansible remediation role for profile anssi_nt28_high
# Profile Title:  ANSSI DAT-NT28 (high)
# Profile Description:
# Draft profile for ANSSI compliance at the high level. ANSSI stands for Agence nationale de la sécurité des systèmes d'information. Based on https://www.ssi.gouv.fr/.
#
# Benchmark ID:  RHEL-7
# Benchmark Version:  0.1.38
#
# XCCDF Version:  1.1
#
# This file was generated by OpenSCAP 1.2.16 using:
# 	$ oscap xccdf generate fix --profile anssi_nt28_high --template urn:xccdf:fix:script:ansible sds.xml 
#
# This script is generated from an OpenSCAP profile without preliminary evaluation.
# It attempts to fix every selected rule, even if the system is already compliant.
#
# How to apply this remediation role:
# $ ansible-playbook -i "192.168.1.155," playbook.yml
# $ ansible-playbook -i inventory.ini playbook.yml
#
###############################################################################


 - hosts: all
   pre_tasks:
     - name: Verify Ansible meets SCAP-Security-Guide version requirements.
       assert:
         that: "ansible_version.full | version_compare('2.3', '>=')"
         msg: >
           "You must update Ansible to at least version 2.3 to use this role."
          
   vars:
   tasks:
    - name: Ensure permission 0000 on /etc/shadow
      file:
        path="{{item}}"
        mode=0000
      with_items:
        - /etc/shadow
      tags:
        - file_permissions_etc_shadow
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - CCE-27100-7
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    
    
    - name: Find /etc/group file(s)
      find:
        paths: "{{ '/etc/group' | dirname }}"
        patterns: "{{ '/etc/group' | basename }}"
      register: files_found
      tags:
        - file_permissions_etc_group
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - CCE-26949-8
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    - name: Set permissions
      file:
        path: "{{ item.path }}"
        mode: 0644
      with_items:
        - "{{ files_found.files }}"
      tags:
        - file_permissions_etc_group
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - CCE-26949-8
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    
    
    - name: Find /etc/gshadow file(s)
      find:
        paths: "{{ '/etc/gshadow' | dirname }}"
        patterns: "{{ '/etc/gshadow' | basename }}"
      register: files_found
      tags:
        - file_permissions_etc_gshadow
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - CCE-27162-7
        - NIST-800-53-AC-6
    
    - name: Set permissions
      file:
        path: "{{ item.path }}"
        mode: 0000
      with_items:
        - "{{ files_found.files }}"
      tags:
        - file_permissions_etc_gshadow
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - CCE-27162-7
        - NIST-800-53-AC-6
    
    
    
    - name: Find /etc/passwd file(s)
      find:
        paths: "{{ '/etc/passwd' | dirname }}"
        patterns: "{{ '/etc/passwd' | basename }}"
      register: files_found
      tags:
        - file_permissions_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - CCE-26887-0
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    - name: Set permissions
      file:
        path: "{{ item.path }}"
        mode: 0644
      with_items:
        - "{{ files_found.files }}"
      tags:
        - file_permissions_etc_passwd
        - medium_severity
        - configure_strategy
        - low_complexity
        - low_disruption
        - CCE-26887-0
        - NIST-800-53-AC-6
        - PCI-DSS-Req-8.7.c
        - CJIS-5.5.2.2
    
    
    - name: Ensure sysctl fs.suid_dumpable is set to 0
      sysctl:
        name: fs.suid_dumpable
        value: 0
        state: present
        reload: yes
      tags:
        - sysctl_fs_suid_dumpable
        - low_severity
        - disable_strategy
        - low_complexity
        - medium_disruption
        - CCE-26900-1
        - NIST-800-53-SI-11
    
    
    - name: Ensure sysctl kernel.randomize_va_space is set to 2
      sysctl:
        name: kernel.randomize_va_space
        value: 2
        state: present
        reload: yes
      tags:
        - sysctl_kernel_randomize_va_space
        - medium_severity
        - disable_strategy
        - low_complexity
        - medium_disruption
        - CCE-27127-0
        - NIST-800-53-SC-30(2)
        - NIST-800-171-3.1.7
        - DISA-STIG-RHEL-07-040201
    
    
    - name: Ensure rsyslog is installed
      package:
        name="{{item}}"
        state=present
      with_items:
        - rsyslog
      tags:
        - package_rsyslog_installed
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-80187-8
        - NIST-800-53-AU-9(2)
    
    
    - name: Enable service rsyslog
      service:
        name="{{item}}"
        enabled="yes"
        state="started"
      with_items:
        - rsyslog
      tags:
        - service_rsyslog_enabled
        - medium_severity
        - enable_strategy
        - low_complexity
        - low_disruption
        - CCE-80188-6
        - NIST-800-53-AU-4(1)
        - NIST-800-53-AU-12
    
    
