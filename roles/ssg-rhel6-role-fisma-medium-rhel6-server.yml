        - unknown_severity
        - disable_strategy
        - low_complexity
        - low_disruption
        - CCE-27359-9
    
    - block:
        - name: "Detect shosts.equiv Files on the System"
          find:
              paths: /
              recurse: yes
              patterns: shosts.equiv
          check_mode: no
          register: shosts_equiv_locations
    
        - name: "Remove Rsh Trust Files"
          file:
              path: "{{ item.path }}"
              state: absent
          with_items: "{{ shosts_equiv_locations.files }}"
          when: shosts_equiv_locations
      tags:
        - no_rsh_trust_files
        - high_severity
        - restrict_strategy
        - low_complexity
        - low_disruption
